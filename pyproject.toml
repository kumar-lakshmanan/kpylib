[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpylib"
version = "0.1.0"
description = "A generic tool collection for Python applications"
readme = "README.md"
authors = [
    {name = "Kumaresan Lakshmanan", email = "kaymatrix@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "pytest-playwright",
    "blinker",
    "wexpect",
    "beautifulsoup4",
    "CouchDB",
    "google-cloud-firestore",
    "google-auth",
    "functions-framework==3.*",
    "pytz",
    "mysql-connector-python",
]

[project.urls]
Homepage = "https://github.com/yourusername/kpylib"
"Bug Reports" = "https://github.com/yourusername/kpylib/issues"
"Source" = "https://github.com/yourusername/kpylib"